name: Testler

on:
  push: {}
  pull_request: {}

# Varsayılan olarak hiçbir yetki yok; her iş yalnızca gerekeni alır.
# Testler hiçbir gizli bilgiye erişmez.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Commit denetimi (atıf satırı ve kişisel e-posta olmamalı)
        run: python -m radar commit-denetimi

  kasa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      # Kasa ve form kuralı testleri Node'un yerleşik araçlarıyla çalışır; paket kurulmaz.
      - run: node --test "kasa/test/*.test.mjs"
